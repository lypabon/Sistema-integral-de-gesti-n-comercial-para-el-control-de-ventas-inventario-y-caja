<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Gestión comercial{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
  header { background: #1f4e79; color: #fff; padding: 12px 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  header a { color: #fff; text-decoration: none; }
  header .marca { font-weight: bold; margin-right: auto; }
  main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border-bottom: 1px solid #dde3ea; padding: 8px; text-align: left; }
  th { background: #e3ecf6; }
  .btn { display: inline-block; padding: 6px 12px; background: #1f4e79; color: #fff; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; font-size: 14px; }
  .btn.sec { background: #6b7a90; }
  .msg { padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; background: #e3ecf6; }
  .msg.error { background: #f8d7da; }
  .inactivo { color: #999; }
  form p { margin: 10px 0; } form label { display: block; font-weight: 600; margin-bottom: 4px; }
  .errorlist { color: #b00020; }
</style>
</head>
<body>
<header>
  <span class="marca">Gestión comercial</span>
  {% if user.is_authenticated %}
    <a href="{% url 'productos:lista' %}">Productos</a>
    {% if user.rol == 'ADMIN' or user.is_superuser %}<a href="{% url 'usuarios:lista' %}">Usuarios</a>{% endif %}
    <span>{{ user.username }} · {{ user.get_rol_display }}</span>
    <form method="post" action="{% url 'logout' %}" style="margin:0">{% csrf_token %}<button class="btn sec">Salir</button></form>
  {% endif %}
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block contenido %}{% endblock %}
</main>
</body>
</html>
